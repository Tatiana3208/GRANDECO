<!DOCTYPE fragment>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #085041;
  --amber: #BA7517; --amber-light: #FAEEDA; --amber-dark: #412402;
  --red: #E24B4A; --red-light: #FCEBEB;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --purple: #6B3FA0; --purple-light: #F0EAF8;
  --text: var(--color-text-primary); --muted: var(--color-text-secondary);
  --bg: var(--color-background-primary); --bg2: var(--color-background-secondary);
  --border: var(--color-border-tertiary);
  --radius: 14px; --radius-sm: 8px;
}

.app { font-family: 'DM Sans', sans-serif; padding: 1.5rem 0; max-width: 640px; margin: 0 auto; }

.screen { display: none; }
.screen.active { display: block; }

/* HOME */
.home-header { text-align: center; padding: 2rem 0 1.5rem; }
.home-logo { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); letter-spacing: -0.5px; }
.home-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.section-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 1.5rem 0 0.5rem; }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 0.5rem; }
.unit-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
.unit-card:hover { border-color: var(--color-border-secondary); transform: translateY(-1px); }
.unit-card.irr { border-left: 3px solid var(--purple); }
.unit-card.coll { border-left: 3px solid var(--blue); }
.unit-num { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.unit-name { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 4px; line-height: 1.3; }
.unit-prog { margin-top: 8px; height: 3px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
.unit-bar { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s; }
.unit-count { font-size: 11px; color: var(--muted); margin-top: 4px; }

.btn-primary { display: block; width: 100%; padding: 12px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: opacity 0.15s; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary { display: block; width: 100%; padding: 11px; background: transparent; color: var(--text); border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
.btn-secondary:hover { background: var(--bg2); }

/* QUIZ */
.quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
.quiz-back { background: none; border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); font-family: 'DM Sans', sans-serif; }
.quiz-back:hover { background: var(--bg2); }
.quiz-meta { flex: 1; }
.quiz-title { font-size: 15px; font-weight: 500; color: var(--text); }
.quiz-subtitle { font-size: 12px; color: var(--muted); }
.quiz-progress-bar { height: 4px; background: var(--bg2); border-radius: 99px; overflow: hidden; margin-bottom: 1.5rem; }
.quiz-progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.4s ease; }

.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; text-align: center; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 1rem; }
.card-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; }
.card-word { font-family: 'DM Serif Display', serif; font-size: 34px; color: var(--text); letter-spacing: -0.5px; line-height: 1.2; }
.card-context { font-size: 13px; color: var(--muted); margin-top: 8px; font-style: italic; line-height: 1.5; }
.card-reveal { font-size: 18px; font-weight: 500; color: var(--text); margin-top: 0.5rem; }
.card-type { font-size: 12px; color: var(--muted); margin-top: 4px; }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.opt { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; color: var(--text); transition: border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: var(--color-border-secondary); background: var(--bg2); }
.opt.correct { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
.opt.wrong { background: var(--red-light); border-color: var(--red); color: #791F1F; }
.opt:disabled { cursor: default; }

.rate-label { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 10px; }
.rate-btns { display: flex; gap: 8px; }
.rate-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.15s; }
.rate-easy { background: var(--green-light); color: var(--green-dark); border-color: var(--green); }
.rate-medium { background: var(--amber-light); color: var(--amber-dark); border-color: var(--amber); }
.rate-hard { background: var(--red-light); color: #791F1F; border-color: var(--red); }

/* RESULTS */
.results-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; margin-bottom: 1rem; }
.results-score { font-family: 'DM Serif Display', serif; font-size: 56px; color: var(--text); }
.results-label { font-size: 14px; color: var(--muted); margin-top: 4px; }
.results-breakdown { display: flex; gap: 12px; margin-top: 1.5rem; justify-content: center; }
.rb { flex: 1; max-width: 120px; padding: 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); }
.rb-num { font-size: 20px; font-weight: 600; }
.rb-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

.next-due { background: var(--blue-light); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: var(--blue); margin-bottom: 1rem; }

/* IRR verb card */
.card-irr { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--text); margin-top: 0.25rem; }
.card-ru { font-size: 15px; color: var(--muted); margin-top: 6px; }
</style>

<div class="app">

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="home-logo">Business Result</div>
    <div class="home-sub">Elementary vocabulary — spaced repetition</div>
  </div>
  <div id="unit-grid-container"></div>
  <button class="btn-primary" onclick="startReview()">Review due words</button>
  <button class="btn-secondary" onclick="startAll()">Practice all learned words</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="quiz-back" onclick="goHome()">← Back</button>
    <div class="quiz-meta">
      <div class="quiz-title" id="quiz-title">Unit 1</div>
      <div class="quiz-subtitle" id="quiz-subtitle">Question 1 of 25</div>
    </div>
  </div>
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>

  <div class="card" id="quiz-card">
    <div class="card-label" id="card-label">What does this word mean?</div>
    <div class="card-word" id="quiz-word">meeting</div>
    <div class="card-context" id="quiz-context"></div>
    <div class="card-reveal" id="quiz-reveal" style="display:none"></div>
    <div class="card-type" id="quiz-type"></div>
  </div>

  <div id="options-area">
    <div class="options-grid" id="options-grid"></div>
  </div>

  <div id="rate-area" style="display:none">
    <div class="rate-label">How well did you know it?</div>
    <div class="rate-btns">
      <button class="rate-btn rate-easy" onclick="rate(3)">Easy</button>
      <button class="rate-btn rate-medium" onclick="rate(2)">Ok</button>
      <button class="rate-btn rate-hard" onclick="rate(1)">Hard</button>
    </div>
  </div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <div class="results-card">
    <div class="results-label" id="results-unit-label">Unit 1 complete</div>
    <div class="results-score" id="results-score">8/10</div>
    <div class="results-label">correct</div>
    <div class="results-breakdown">
      <div class="rb">
        <div class="rb-num" id="rb-easy" style="color:var(--green)">0</div>
        <div class="rb-label">Easy</div>
      </div>
      <div class="rb">
        <div class="rb-num" id="rb-medium" style="color:var(--amber)">0</div>
        <div class="rb-label">Ok</div>
      </div>
      <div class="rb">
        <div class="rb-num" id="rb-hard" style="color:var(--red)">0</div>
        <div class="rb-label">Hard</div>
      </div>
    </div>
  </div>
  <div class="next-due" id="next-due-msg"></div>
  <button class="btn-primary" onclick="goHome()">Back to units</button>
  <button class="btn-secondary" onclick="retryHard()">Retry hard words</button>
</div>

</div>

const SECTION_ORDER = [
  { label: "Units 1–6", keys: ["Unit 1A","Unit 1B","Unit 2A","Unit 2B","Unit 3A","Unit 3B","Unit 4A","Unit 4B","Unit 5A","Unit 5B","Unit 6A","Unit 6B"] },
  { label: "Units 7–12", keys: ["Unit 7A","Unit 7B","Unit 8A","Unit 8B","Unit 9A","Unit 9B","Unit 10A","Unit 10B","Unit 11A","Unit 11B","Unit 12A","Unit 12B"] },
  { label: "Irregular Verbs", keys: ["Irregular Verbs A","Irregular Verbs B","Irregular Verbs C","Irregular Verbs D","Irregular Verbs E"] }
];

const units = Object.keys(VOCAB);

let progress = {};
let quizQueue = [];
let quizIndex = 0;
let quizMode = '';
let currentUnit = '';
let currentItem = null;
let sessionStats = { easy: 0, medium: 0, hard: 0, correct: 0, total: 0 };
let hardWords = [];

function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem('br_elem_v2_progress') || '{}'); } catch(e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem('br_elem_v2_progress', JSON.stringify(progress)); } catch(e) {}
}

function getWordKey(unit, word) { return unit + '::' + word; }
function getInterval(level) { return [0, 1, 3, 7, 14, 30][Math.min(level, 5)]; }
function isDue(key) { const p = progress[key]; if (!p) return false; return Date.now() >= (p.nextDue || 0); }
function isLearned(key) { return !!(progress[key]); }

function getUnitShortLabel(unitKey) {
  const dash = unitKey.indexOf('–');
  if (dash !== -1) return unitKey.substring(0, dash).trim();
  return unitKey;
}
function getUnitName(unitKey) {
  const dash = unitKey.indexOf('–');
  if (dash !== -1) return unitKey.substring(dash + 1).trim();
  return unitKey;
}

function renderHome() {
  const container = document.getElementById('unit-grid-container');
  container.innerHTML = '';

  SECTION_ORDER.forEach(section => {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = section.label;
    container.appendChild(lbl);

    const grid = document.createElement('div');
    grid.className = 'unit-grid';

    section.keys.forEach(prefix => {
      // find matching unit key
      const matchingKey = units.find(u => u.startsWith(prefix));
      if (!matchingKey) return;
      const words = VOCAB[matchingKey];
      let learned = 0, due = 0;
      words.forEach(item => {
        const key = getWordKey(matchingKey, item.word);
        if (isLearned(key)) { learned++; if (isDue(key)) due++; }
      });
      const pct = Math.round((learned / words.length) * 100);
      const card = document.createElement('div');
      const isIrr = matchingKey.startsWith('Irregular');
      card.className = 'unit-card' + (isIrr ? ' irr' : '');

      const shortNum = getUnitShortLabel(matchingKey);
      const name = getUnitName(matchingKey);

      card.innerHTML = `<div class="unit-num">${shortNum}</div><div class="unit-name">${name}</div><div class="unit-prog"><div class="unit-bar" style="width:${pct}%"></div></div><div class="unit-count">${learned}/${words.length} learned${due > 0 ? ` · <span style="color:var(--amber)">${due} due</span>` : ''}</div>`;
      card.onclick = () => startUnit(matchingKey);
      grid.appendChild(card);
    });

    container.appendChild(grid);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { renderHome(); showScreen('screen-home'); }

function startUnit(unit) {
  currentUnit = unit;
  quizMode = 'unit';
  quizQueue = shuffle([...VOCAB[unit]]);
  sessionStats = { easy: 0, medium: 0, hard: 0, correct: 0, total: 0 };
  hardWords = [];
  quizIndex = 0;
  document.getElementById('quiz-title').textContent = unit;
  showScreen('screen-quiz');
  showQuestion();
}

function startReview() {
  quizMode = 'review';
  quizQueue = [];
  units.forEach(unit => {
    VOCAB[unit].forEach(item => {
      const key = getWordKey(unit, item.word);
      if (isDue(key)) quizQueue.push({ ...item, _unit: unit });
    });
  });
  if (quizQueue.length === 0) {
    alert('No words due for review right now. Come back later or practice all learned words.');
    return;
  }
  quizQueue = shuffle(quizQueue);
  sessionStats = { easy: 0, medium: 0, hard: 0, correct: 0, total: 0 };
  hardWords = [];
  quizIndex = 0;
  document.getElementById('quiz-title').textContent = 'Review';
  showScreen('screen-quiz');
  showQuestion();
}

function startAll() {
  quizMode = 'all';
  quizQueue = [];
  units.forEach(unit => {
    VOCAB[unit].forEach(item => {
      const key = getWordKey(unit, item.word);
      if (isLearned(key)) quizQueue.push({ ...item, _unit: unit });
    });
  });
  if (quizQueue.length === 0) {
    alert('No learned words yet. Start with a unit first.');
    return;
  }
  quizQueue = shuffle(quizQueue);
  sessionStats = { easy: 0, medium: 0, hard: 0, correct: 0, total: 0 };
  hardWords = [];
  quizIndex = 0;
  document.getElementById('quiz-title').textContent = 'All words';
  showScreen('screen-quiz');
  showQuestion();
}

function retryHard() {
  if (hardWords.length === 0) { goHome(); return; }
  quizQueue = shuffle([...hardWords]);
  hardWords = [];
  sessionStats = { easy: 0, medium: 0, hard: 0, correct: 0, total: 0 };
  quizIndex = 0;
  showScreen('screen-quiz');
  showQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getDistractors(item, unit) {
  // For irregular verbs: pick distractors only from irr items
  const isIrrItem = item.type === 'irr';
  let pool;
  if (isIrrItem) {
    pool = units.filter(u => u.startsWith('Irregular')).flatMap(u => VOCAB[u]);
  } else {
    pool = unit ? VOCAB[unit] : Object.values(VOCAB).flat().filter(w => w.type !== 'irr');
  }
  const others = pool.filter(w => w.word !== item.word);
  return shuffle(others).slice(0, 3).map(w => w.def);
}

function showQuestion() {
  if (quizIndex >= quizQueue.length) { showResults(); return; }
  currentItem = quizQueue[quizIndex];
  const pct = Math.round((quizIndex / quizQueue.length) * 100);
  document.getElementById('quiz-progress-fill').style.width = pct + '%';
  document.getElementById('quiz-subtitle').textContent = `Question ${quizIndex + 1} of ${quizQueue.length}`;

  const isIrr = currentItem.type === 'irr';
  const cardLabel = document.getElementById('card-label');
  if (isIrr) {
    cardLabel.textContent = 'Past · Past Participle · Translation?';
  } else if (currentItem.type === 'collocation') {
    cardLabel.textContent = 'What does this phrase mean?';
  } else {
    cardLabel.textContent = 'What does this word mean?';
  }

  document.getElementById('quiz-word').textContent = currentItem.word;
  document.getElementById('quiz-context').textContent = currentItem.ctx || '';
  document.getElementById('quiz-reveal').style.display = 'none';
  document.getElementById('quiz-type').textContent = '';
  document.getElementById('options-area').style.display = 'block';
  document.getElementById('rate-area').style.display = 'none';

  const unit = currentItem._unit || currentUnit;
  const distractors = getDistractors(currentItem, unit);
  const opts = shuffle([currentItem.def, ...distractors]);
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectOption(btn, opt === currentItem.def);
    grid.appendChild(btn);
  });
}

function selectOption(btn, isCorrect) {
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === currentItem.def) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');
  sessionStats.total++;
  if (isCorrect) sessionStats.correct++;

  document.getElementById('quiz-reveal').textContent = currentItem.def;
  document.getElementById('quiz-reveal').style.display = 'block';
  document.getElementById('quiz-type').textContent = currentItem.type;
  document.getElementById('options-area').style.display = 'none';
  document.getElementById('rate-area').style.display = 'block';

  const key = getWordKey(currentItem._unit || currentUnit, currentItem.word);
  if (!progress[key]) progress[key] = { level: 0, nextDue: 0 };
}

function rate(r) {
  const key = getWordKey(currentItem._unit || currentUnit, currentItem.word);
  if (!progress[key]) progress[key] = { level: 0 };
  let level = progress[key].level || 0;
  if (r === 3) { level = Math.min(level + 2, 5); sessionStats.easy++; }
  else if (r === 2) { level = Math.min(level + 1, 5); sessionStats.medium++; }
  else { level = Math.max(level - 1, 0); sessionStats.hard++; hardWords.push(currentItem); }
  const days = getInterval(level);
  progress[key] = { level, nextDue: Date.now() + days * 864e5 };
  saveProgress();
  quizIndex++;
  showQuestion();
}

function showResults() {
  const s = sessionStats;
  document.getElementById('results-unit-label').textContent = document.getElementById('quiz-title').textContent + ' complete';
  document.getElementById('results-score').textContent = s.correct + '/' + s.total;
  document.getElementById('rb-easy').textContent = s.easy;
  document.getElementById('rb-medium').textContent = s.medium;
  document.getElementById('rb-hard').textContent = s.hard;

  let dueMsg = 'Hard words will appear again next session.';
  if (s.easy > 0) dueMsg = 'Easy words: review in 7 days. Hard words: review tomorrow.';
  document.getElementById('next-due-msg').textContent = dueMsg;

  const retryBtn = document.querySelector('#screen-results .btn-secondary');
  if (hardWords.length === 0) {
    retryBtn.style.display = 'none';
  } else {
    retryBtn.style.display = 'block';
    retryBtn.textContent = `Retry ${hardWords.length} hard word${hardWords.length > 1 ? 's' : ''}`;
  }
  showScreen('screen-results');
}

loadProgress();
renderHome();
</script>
