<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irregular Verbs — SRS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   TOKENS
───────────────────────────────────────── */
:root {
  --bg:       #0f0f14;
  --surface:  #1a1a24;
  --surface2: #22222f;
  --border:   rgba(255,255,255,0.08);
  --text:     #f0eff8;
  --muted:    #8a8aaa;
  --accent:   #7c6ff7;
  --accent2:  #a78bfa;
  --green:    #34d399;
  --green-bg: rgba(52,211,153,0.13);
  --red:      #f87171;
  --red-bg:   rgba(248,113,113,0.13);
  --amber:    #f59e0b;
  --amber-bg: rgba(245,158,11,0.13);
  --gold:     #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen { display: none; width: 100%; max-width: 760px; padding: 2rem 1.5rem 4rem; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ─────────────────────────────────────────
   HOME  ·  header
───────────────────────────────────────── */
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  letter-spacing: -1px;
  margin-bottom: .25rem;
}
.logo span { color: var(--accent2); }
.tagline { color: var(--muted); font-size: .93rem; margin-bottom: 2.2rem; }

/* ─────────────────────────────────────────
   TABS  (Units / Due / Progress)
───────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  width: 100%;
  max-width: 480px;
  margin-bottom: 2rem;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: .88rem;
  font-weight: 500;
  padding: .55rem .8rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
}
.tab-btn.active { background: var(--accent); color: #fff; }
.tab-count {
  font-size: .68rem;
  font-weight: 700;
  background: var(--surface2);
  color: var(--muted);
  border-radius: 99px;
  padding: 1px 7px;
  min-width: 20px;
  text-align: center;
  transition: all .2s;
}
.tab-btn.active .tab-count { background: rgba(255,255,255,.22); color: #fff; }
.tab-count.has-due { background: var(--red-bg); color: var(--red); }
.tab-btn.active .tab-count.has-due { background: rgba(255,255,255,.22); color: #fff; }

.tab-panel { display: none; width: 100%; }
.tab-panel.active { display: block; }

/* ─────────────────────────────────────────
   UNITS GRID
───────────────────────────────────────── */
.units-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 1rem;
  width: 100%;
}
.unit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.3rem 1.5rem;
  cursor: pointer;
  transition: all .2s;
}
.unit-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
.unit-card:active { transform: translateY(0); }
.unit-num { font-size: .7rem; font-weight: 700; color: var(--accent); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: .45rem; }
.unit-title { font-size: .92rem; font-weight: 500; margin-bottom: .7rem; line-height: 1.3; }
.unit-meta { font-size: .78rem; color: var(--muted); }
.unit-stars { font-size: .82rem; color: var(--gold); margin-top: .35rem; }
.unit-bar { height: 3px; background: var(--border); border-radius: 99px; margin-top: .75rem; overflow: hidden; }
.unit-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .4s; }
.units-footer { font-size: .76rem; color: var(--muted); margin-top: 1.4rem; text-align: center; }

/* ─────────────────────────────────────────
   DUE TAB
───────────────────────────────────────── */
.due-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  width: 100%;
}
.due-header-text { font-size: .88rem; color: var(--muted); }
.due-start-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: .55rem 1.3rem;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s;
}
.due-start-btn:hover { background: var(--accent2); }

.due-group { margin-bottom: 1.6rem; }
.due-group-label {
  font-size: .7rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: .55rem;
  padding-left: .15rem;
}
.due-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .6rem 1rem;
  margin-bottom: .38rem;
  font-size: .87rem;
}
.due-row .dr-forms { flex: 1; font-weight: 500; }
.due-row .dr-ru { color: var(--muted); font-size: .78rem; white-space: nowrap; }
.conf-pill {
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
}
.conf-pill.easy { background: var(--green-bg); color: var(--green); }
.conf-pill.ok   { background: var(--amber-bg); color: var(--amber); }
.conf-pill.hard { background: var(--red-bg);   color: var(--red); }
.conf-pill.new  { background: rgba(124,111,247,.15); color: var(--accent2); }

.due-empty { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
.due-empty-icon { font-size: 3rem; margin-bottom: 1rem; }
.due-empty p { font-size: .95rem; line-height: 1.7; }

/* ─────────────────────────────────────────
   STUDY SCREEN  ·  header / progress
───────────────────────────────────────── */
.study-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.6rem;
}
.back-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: .5rem 1.1rem;
  border-radius: 9px;
  cursor: pointer;
  font-size: .84rem;
  font-family: inherit;
  transition: all .2s;
}
.back-btn:hover { color: var(--text); border-color: var(--accent); }
.q-counter { font-size: .85rem; color: var(--muted); }
.q-counter strong { color: var(--text); }

.top-bar-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 1.8rem; }
.top-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

.srs-pill {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: .28rem .85rem;
  font-size: .74rem;
  color: var(--muted);
  margin-bottom: .9rem;
}
.srs-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.streak-row { display: flex; gap: 5px; margin-bottom: 1.4rem; }
.streak-pip {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: background .25s, box-shadow .25s;
}
.streak-pip.lit { background: var(--gold); box-shadow: 0 0 7px rgba(251,191,36,.55); }

/* ─────────────────────────────────────────
   VERB CARD
───────────────────────────────────────── */
.card-wrap { width: 100%; max-width: 530px; margin-bottom: 1.4rem; }
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 2.4rem 2rem 1.8rem;
  text-align: center;
  transition: border-color .28s, box-shadow .28s;
}
.card.correct { border-color: var(--green); box-shadow: 0 0 36px rgba(52,211,153,.16); }
.card.wrong   { border-color: var(--red);   box-shadow: 0 0 36px rgba(248,113,113,.16); }

.card-label { font-size: .8rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: .5rem; }
.card-translation { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--text); margin-bottom: .25rem; line-height: 1.2; }
.card-base { font-size: .8rem; color: var(--muted); margin-bottom: 1.5rem; }
.card-ask-label { font-size: .74rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: .4rem; }
.card-ask-form { font-size: 1.05rem; color: var(--muted); font-style: italic; }

.reveal-row {
  display: none;
  gap: .5rem;
  justify-content: center;
  align-items: center;
  margin: 1.1rem 0 .4rem;
  flex-wrap: wrap;
}
.fb { /* form badge */
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .32rem .8rem;
  font-size: .84rem;
  font-weight: 500;
  transition: all .28s;
}
.fb.hit  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.fb.miss { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.fb.dim  { opacity: .35; }
.fb-arr  { color: var(--muted); font-size: .8rem; }

/* ─────────────────────────────────────────
   ANSWER OPTIONS
───────────────────────────────────────── */
.opt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .7rem;
  width: 100%;
  max-width: 530px;
}
.opt {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 13px;
  padding: .95rem 1rem;
  cursor: pointer;
  font-family: inherit;
  font-size: .9rem;
  line-height: 1.4;
  text-align: center;
  transition: all .16s;
}
.opt:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); transform: translateY(-1px); }
.opt:active:not(:disabled) { transform: translateY(0); }
.opt:disabled { cursor: not-allowed; }
.opt.sel-correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.opt.sel-wrong   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.opt.rev-correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.opt-trap {
  display: block;
  font-size: .63rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--red);
  opacity: 0;
  transition: opacity .3s .15s;
  margin-top: 3px;
}
.opt.sel-wrong .opt-trap { opacity: 1; }

/* ─────────────────────────────────────────
   CONFIDENCE BUTTONS
───────────────────────────────────────── */
.conf-label {
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 1.1rem;
  margin-bottom: .5rem;
  opacity: 0;
  transform: translateY(6px);
  transition: all .25s .05s;
  pointer-events: none;
  width: 100%;
  max-width: 530px;
  text-align: center;
}
.conf-label.show { opacity: 1; transform: translateY(0); pointer-events: none; }

.conf-row {
  display: flex;
  gap: .6rem;
  width: 100%;
  max-width: 530px;
  opacity: 0;
  transform: translateY(8px);
  transition: all .28s .1s;
  pointer-events: none;
}
.conf-row.show { opacity: 1; transform: translateY(0); pointer-events: all; }

.conf-btn {
  flex: 1;
  border: 1.5px solid;
  border-radius: 12px;
  padding: .72rem .4rem;
  font-family: inherit;
  font-size: .86rem;
  font-weight: 700;
  cursor: pointer;
  transition: filter .18s, transform .18s;
  text-align: center;
}
.conf-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.conf-btn:active { transform: translateY(0); }
.conf-sub { display: block; font-size: .68rem; font-weight: 400; opacity: .7; margin-top: 2px; }

.conf-btn.easy { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.conf-btn.ok   { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.conf-btn.hard { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }

/* ─────────────────────────────────────────
   FEEDBACK FLASH
───────────────────────────────────────── */
.feedback-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 200;
}
.feedback-icon {
  font-size: 5.5rem;
  opacity: 0;
  transform: scale(.3);
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
}
.feedback-icon.pop  { opacity: 1; transform: scale(1); }
.feedback-icon.fade { opacity: 0; transform: scale(1.25); transition: all .35s ease; }

/* ─────────────────────────────────────────
   RESULT SCREEN
───────────────────────────────────────── */
.res-unit-label { font-size: .8rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: .5rem; }
.res-score { font-family: 'Playfair Display', serif; font-size: 4.2rem; font-weight: 700; color: var(--accent2); line-height: 1; margin-bottom: .3rem; }
.res-caption { color: var(--muted); font-size: 1rem; margin-bottom: 2rem; }

.res-list { width: 100%; }
.res-row {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .58rem .8rem;
  border-bottom: 1px solid var(--border);
  font-size: .84rem;
}
.res-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.res-dot.ok   { background: var(--green); }
.res-dot.fail { background: var(--red); }
.res-forms { flex: 1; font-weight: 500; }
.res-ru { color: var(--muted); font-size: .78rem; }

.res-btns { display: flex; gap: .9rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
.btn-pri {
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  padding: .8rem 2.2rem;
  font-family: inherit; font-size: .9rem; font-weight: 500;
  cursor: pointer; transition: background .2s;
}
.btn-pri:hover { background: var(--accent2); }
.btn-sec {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  padding: .8rem 2.2rem;
  font-family: inherit; font-size: .9rem;
  cursor: pointer; transition: all .2s;
}
.btn-sec:hover { border-color: var(--accent); }

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
/* ─────────────────────────────────────────
   PROGRESS TAB
───────────────────────────────────────── */

/* top stat cards */
.prog-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .75rem;
  width: 100%;
  margin-bottom: 1.8rem;
}
.prog-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.1rem .8rem;
  text-align: center;
}
.prog-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--accent2);
  line-height: 1;
  margin-bottom: .3rem;
}
.prog-stat-lbl { font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .5px; }

/* overall accuracy bar */
.prog-accuracy-wrap { width: 100%; margin-bottom: 2rem; }
.prog-accuracy-label {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: .45rem;
}
.prog-accuracy-label strong { color: var(--text); }
.prog-accuracy-bar { width: 100%; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-accuracy-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }

/* per-unit accordion */
.prog-unit-block { width: 100%; margin-bottom: .6rem; }
.prog-unit-header {
  display: flex;
  align-items: center;
  gap: .8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .85rem 1.1rem;
  cursor: pointer;
  transition: border-color .2s;
  user-select: none;
}
.prog-unit-header:hover { border-color: var(--accent); }
.prog-unit-header.open { border-radius: 12px 12px 0 0; border-color: var(--accent); }
.puh-num { font-size: .68rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
.puh-title { font-size: .88rem; font-weight: 500; flex: 1; }
.puh-meta { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
.puh-chevron { color: var(--muted); font-size: .8rem; transition: transform .2s; flex-shrink: 0; }
.prog-unit-header.open .puh-chevron { transform: rotate(90deg); }
.puh-mini-bar { width: 48px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; flex-shrink: 0; }
.puh-mini-fill { height: 100%; background: var(--accent); border-radius: 99px; }

.prog-unit-body {
  display: none;
  background: var(--surface2);
  border: 1px solid var(--accent);
  border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
}
.prog-unit-body.open { display: block; }

.prog-verb-row {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .55rem 1.1rem;
  border-bottom: 1px solid var(--border);
  font-size: .82rem;
}
.prog-verb-row:last-child { border-bottom: none; }
.pvr-forms { flex: 1; font-weight: 500; }
.pvr-ru { color: var(--muted); font-size: .76rem; }
.pvr-reps { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.pvr-next { font-size: .7rem; color: var(--muted); white-space: nowrap; text-align: right; }
.pvr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pvr-dot.mastered { background: var(--green); }
.pvr-dot.learning { background: var(--amber); }
.pvr-dot.struggling { background: var(--red); }
.pvr-dot.unseen { background: var(--border); }

/* reset button */
.prog-reset-row { width: 100%; display: flex; justify-content: center; margin-top: 2rem; }
.prog-reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 9px;
  padding: .5rem 1.4rem;
  font-family: inherit;
  font-size: .8rem;
  cursor: pointer;
  transition: all .2s;
}
.prog-reset-btn:hover { border-color: var(--red); color: var(--red); }

@media (max-width: 520px) {
  .opt-grid { grid-template-columns: 1fr; }
  .card-translation { font-size: 1.6rem; }
  .conf-btn { padding: .62rem .3rem; font-size: .8rem; }
  .conf-sub { font-size: .63rem; }
  .res-score { font-size: 3rem; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     HOME SCREEN
════════════════════════════════════════════ -->
<div class="screen active" id="screen-home">
  <div style="text-align:center;padding:3rem 0 2rem;width:100%">
    <div class="logo">Irregular<span>Verbs</span></div>
    <div class="tagline">Spaced Repetition · 120 irregular verbs · Russian translation</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-units" onclick="switchTab('units',this)">Units</button>
    <button class="tab-btn"        id="tab-btn-due"   onclick="switchTab('due',this)">
      Due &nbsp;<span class="tab-count" id="due-count">0</span>
    </button>
    <button class="tab-btn"        id="tab-btn-progress" onclick="switchTab('progress',this)">Progress</button>
  </div>

  <!-- UNITS -->
  <div class="tab-panel active" id="tab-units">
    <div class="units-grid" id="units-grid"></div>
    <p class="units-footer">All units are open · progress saved in your browser</p>
  </div>

  <!-- DUE -->
  <div class="tab-panel" id="tab-due">
    <div id="due-content"></div>
  </div>

  <!-- PROGRESS -->
  <div class="tab-panel" id="tab-progress">
    <div id="progress-content"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     STUDY SCREEN
════════════════════════════════════════════ -->
<div class="screen" id="screen-study">
  <div class="study-header">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="q-counter"><strong id="q-cur">1</strong> / <span id="q-tot">20</span></div>
  </div>
  <div class="top-bar-wrap"><div class="top-bar-fill" id="top-bar" style="width:0%"></div></div>

  <div class="srs-pill"><div class="srs-pip"></div><span id="srs-label">New card</span></div>
  <div class="streak-row" id="streak-row"></div>

  <div class="card-wrap">
    <div class="card" id="main-card">
      <div class="card-label">Translation</div>
      <div class="card-translation" id="c-translation">—</div>

/* ═══════════════════════════════════════
   SRS STORAGE
   progress[uid][idx] = {
     interval, due, reps, correct, confidence
   }
═══════════════════════════════════════ */
let progress = JSON.parse(localStorage.getItem('ivsrs3') || '{}');

function vp(uid, idx) {
  if (!progress[uid]) progress[uid] = {};
  if (!progress[uid][idx]) progress[uid][idx] = { interval:1, due:0, reps:0, correct:0, confidence:'new' };
  return progress[uid][idx];
}
function save() { localStorage.setItem('ivsrs3', JSON.stringify(progress)); }

// SRS intervals in days per confidence rating
const CONF_DAYS = { easy: 5, ok: 2, hard: 1 };

function applyRating(uid, idx, wasCorrect, conf) {
  const p = vp(uid, idx);
  p.reps++;
  p.confidence = conf;
  if (wasCorrect) {
    p.correct++;
    const base = CONF_DAYS[conf];
    p.interval = conf === 'easy' ? Math.max(p.interval * 2, base) : base;
  } else {
    p.correct = Math.max(0, p.correct - 1);
    p.interval = 1;
  }
  p.due = Date.now() + p.interval * 86400000;
  save();
}

function unitStars(uid) {
  const u = UNITS[uid]; let m = 0;
  u.verbs.forEach((_, i) => { if (vp(uid, i).correct >= 3) m++; });
  if (m === u.verbs.length) return 3;
  if (m >= u.verbs.length * 0.6) return 2;
  if (m >= u.verbs.length * 0.3) return 1;
  return 0;
}
function unitPct(uid) {
  const u = UNITS[uid]; let m = 0;
  u.verbs.forEach((_, i) => { if (vp(uid, i).correct >= 3) m++; });
  return Math.round(m / u.verbs.length * 100);
}
function getDue() {
  const now = Date.now(), out = [];
  UNITS.forEach((u, uid) => {
    u.verbs.forEach((verb, idx) => {
      const p = vp(uid, idx);
      if (p.reps > 0 && p.due <= now) out.push({ verb, uid, idx, p });
    });
  });
  return out;
}

   HOME  /  TAB LOGIC
═══════════════════════════════════════ */
let activeTab = 'units';

function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'due') renderDue();
  if (tab === 'progress') renderProgress();
}

function renderHome() {
  renderUnits();
  updateDueBadge();
  if (activeTab === 'due') renderDue();
  if (activeTab === 'progress') renderProgress();
}

function updateDueBadge() {
  const n = getDue().length;
  const el = document.getElementById('due-count');
  el.textContent = n;
  el.className = 'tab-count' + (n > 0 ? ' has-due' : '');
}

/* ── Progress tab ── */
function renderProgress() {
  const c = document.getElementById('progress-content');

  // ── global stats ──
  let totalVerbs = 0, seenVerbs = 0, masteredVerbs = 0;
  let totalReps = 0, totalCorrect = 0;

  UNITS.forEach((u, uid) => {
    u.verbs.forEach((_, idx) => {
      totalVerbs++;
      const p = vp(uid, idx);
      if (p.reps > 0) seenVerbs++;
      if (p.correct >= 3) masteredVerbs++;
      totalReps    += p.reps;
      totalCorrect += p.correct;
    });
  });

  const accuracy = totalReps > 0 ? Math.round(totalCorrect / totalReps * 100) : 0;
  const dueCount = getDue().length;

  // ── build HTML ──
  let html = `
  <!-- Stat cards -->
  <div class="prog-stats">
    <div class="prog-stat">
      <div class="prog-stat-val">${masteredVerbs}</div>
      <div class="prog-stat-lbl">Mastered</div>
    </div>
    <div class="prog-stat">
      <div class="prog-stat-val">${seenVerbs}</div>
      <div class="prog-stat-lbl">Studied</div>
    </div>
    <div class="prog-stat">
      <div class="prog-stat-val">${totalVerbs - seenVerbs}</div>
      <div class="prog-stat-lbl">New</div>
    </div>
  </div>

  <!-- Accuracy bar -->
  <div class="prog-accuracy-wrap">
    <div class="prog-accuracy-label">
      <span>Overall accuracy</span>
      <strong>${accuracy}%</strong>
    </div>
    <div class="prog-accuracy-bar">
      <div class="prog-accuracy-fill" style="width:${accuracy}%"></div>
    </div>
  </div>
  `;

  // ── per-unit accordion ──
  UNITS.forEach((unit, uid) => {
    let unitSeen = 0, unitMastered = 0;
    unit.verbs.forEach((_, idx) => {
      const p = vp(uid, idx);
      if (p.reps > 0) unitSeen++;
      if (p.correct >= 3) unitMastered++;
    });
    const pct = Math.round(unitMastered / unit.verbs.length * 100);
    const metaStr = unitSeen === 0 ? 'Not started'
      : `${unitMastered}/${unit.verbs.length} mastered`;

    html += `
    <div class="prog-unit-block">
      <div class="prog-unit-header" onclick="toggleProgUnit(${uid}, this)">
        <span class="puh-num">UNIT ${uid + 1}</span>
        <span class="puh-title">${unit.title}</span>
        <span class="puh-meta">${metaStr}</span>
        <div class="puh-mini-bar"><div class="puh-mini-fill" style="width:${pct}%"></div></div>
        <span class="puh-chevron">›</span>
      </div>
      <div class="prog-unit-body" id="prog-body-${uid}">`;

    unit.verbs.forEach((verb, idx) => {
      const p = vp(uid, idx);
      // dot colour
      let dotCls = 'unseen';
      if (p.reps > 0) {
        if (p.correct >= 3) dotCls = 'mastered';
        else if (p.correct >= 1) dotCls = 'learning';
        else dotCls = 'struggling';
      }
      // next review label
      let nextStr = '—';
      if (p.reps > 0) {
        const diff = p.due - Date.now();
        if (diff <= 0) nextStr = 'Due now';
        else {
          const days = Math.ceil(diff / 86400000);
          nextStr = days === 1 ? 'Tomorrow' : `In ${days} days`;
        }
      }
      // confidence pill
      const conf = p.confidence;
      const pillHtml = p.reps > 0
        ? `<span class="conf-pill ${conf}">${conf.toUpperCase()}</span>`
        : `<span class="conf-pill new">NEW</span>`;

      html += `
        <div class="prog-verb-row">
          <div class="pvr-dot ${dotCls}"></div>
          <div class="pvr-forms">${verb.v1} — ${verb.v2} — ${verb.v3}</div>
          <div class="pvr-ru">${verb.ru}</div>
          ${pillHtml}
          <div class="pvr-reps">${p.reps > 0 ? p.reps + ' rep' + (p.reps !== 1 ? 's' : '') : ''}</div>
          <div class="pvr-next">${nextStr}</div>
        </div>`;
    });

    html += `</div></div>`;
  });

  // ── legend ──
  html += `
  <div style="display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:1.4rem;font-size:.75rem;color:var(--muted);">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle"></span>Mastered (3+ correct)</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:5px;vertical-align:middle"></span>Learning</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle"></span>Struggling</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border);margin-right:5px;vertical-align:middle"></span>Not seen</span>
  </div>

  <div class="prog-reset-row">
    <button class="prog-reset-btn" onclick="resetAllProgress()">Reset all progress</button>
  </div>`;

  c.innerHTML = html;
}

function toggleProgUnit(uid, header) {
  const body = document.getElementById('prog-body-' + uid);
  const isOpen = body.classList.contains('open');
  // close all
  document.querySelectorAll('.prog-unit-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.prog-unit-header').forEach(h => h.classList.remove('open'));
  // open clicked if it was closed
  if (!isOpen) { body.classList.add('open'); header.classList.add('open'); }
}

function resetAllProgress() {
  if (!confirm('Reset ALL progress? This cannot be undone.')) return;
  progress = {};
  save();
  renderHome();
}

function renderUnits() {
  const grid = document.getElementById('units-grid');
  grid.innerHTML = '';
  UNITS.forEach((unit, uid) => {
    const stars = unitStars(uid);
    const pct   = unitPct(uid);
    const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `
      <div class="unit-num">UNIT ${uid + 1}</div>
      <div class="unit-title">${unit.title}</div>
      <div class="unit-meta">${unit.verbs.length} verbs</div>
      <div class="unit-stars">${starStr}</div>
      <div class="unit-bar"><div class="unit-bar-fill" style="width:${pct}%"></div></div>`;
    card.onclick = () => startUnit(uid);
    grid.appendChild(card);
  });
}

/* ── Due tab ── */
function renderDue() {
  const due = getDue();
  const c = document.getElementById('due-content');
  if (!due.length) {
    c.innerHTML = `<div class="due-empty">
      <div class="due-empty-icon">🎉</div>
      <p>No verbs due for review right now.<br>Come back later or start a new unit!</p>
    </div>`;
    return;
  }
  // group by unit
  const groups = {};
  due.forEach(item => {
    if (!groups[item.uid]) groups[item.uid] = [];
    groups[item.uid].push(item);
  });

  let html = `<div class="due-header">
    <span class="due-header-text">${due.length} verb${due.length !== 1 ? 's' : ''} to review</span>
    <button class="due-start-btn" onclick="startDueSession()">Start review →</button>
  </div>`;

  Object.keys(groups).sort((a,b)=>+a-+b).forEach(uid => {
    html += `<div class="due-group">
      <div class="due-group-label">UNIT ${+uid + 1} — ${UNITS[uid].title}</div>`;
    groups[uid].forEach(item => {
      const conf = item.p.confidence;
      html += `<div class="due-row">
        <div class="dr-forms">${item.verb.v1} — ${item.verb.v2} — ${item.verb.v3}</div>
        <div class="dr-ru">${item.verb.ru}</div>
        <span class="conf-pill ${conf}">${conf.toUpperCase()}</span>
      </div>`;
    });
    html += `</div>`;
  });

  c.innerHTML = html;
}

/* ═══════════════════════════════════════
   STUDY  /  SESSION STATE
═══════════════════════════════════════ */
const FORMS  = ['v1', 'v2', 'v3'];
const FLABEL = {
  v1: 'Infinitive (V1)',
  v2: 'Past Simple (V2)',
  v3: 'Past Participle (V3)'
};

let currentUnit  = null;   // null = due session
let queue        = [];
let qIdx         = 0;
let sessionLog   = [];     // { verb, uid, idx, correct }
let streak       = 0;
let waitAnswer   = false;  // true when waiting for confidence click
let lastCorrect  = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startUnit(uid) {
  currentUnit = uid;
  const items = UNITS[uid].verbs.map((verb, idx) => ({ verb, uid, idx, p: vp(uid, idx) }));
  queue = shuffle(items).map(it => ({ ...it, form: FORMS[Math.floor(Math.random() * 3)] }));
  launchSession();
}

function startDueSession() {
  currentUnit = null;
  const items = getDue();
  queue = shuffle(items).map(it => ({ ...it, form: FORMS[Math.floor(Math.random() * 3)] }));
  launchSession();
}

function launchSession() {
  qIdx = 0; sessionLog = []; streak = 0; waitAnswer = false;
  renderStreak();
  showScreen('study');
  loadQ();
}

/* ── Streak dots ── */
function renderStreak() {
  const row = document.getElementById('streak-row');
  row.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const d = document.createElement('div');
    d.className = 'streak-pip' + (i < streak ? ' lit' : '');
    row.appendChild(d);
  }
}

/* ── Load question ── */
function loadQ() {
  waitAnswer = false;
  lastCorrect = false;

  const { verb, uid, idx, p, form } = queue[qIdx];
  const total = queue.length;

  document.getElementById('q-cur').textContent  = qIdx + 1;
  document.getElementById('q-tot').textContent  = total;
  document.getElementById('top-bar').style.width = (qIdx / total * 100) + '%';

  // SRS label
  const lbl = document.getElementById('srs-label');
  lbl.textContent = p.reps === 0   ? 'New card'
    : p.correct  >= 3              ? '⭐ Well known'
    : `Review #${p.reps + 1}`;

  // Card
  document.getElementById('c-translation').textContent = verb.ru;
  document.getElementById('c-base').textContent        = `to ${verb.v1}`;
  document.getElementById('c-ask-form').textContent    = FLABEL[form];

  // Reset form badges
  const rr = document.getElementById('reveal-row');
  rr.style.display = 'none';
  ['v1','v2','v3'].forEach(f => {
    const el = document.getElementById('rb-' + f);
    el.textContent = verb[f];
    el.className = 'fb';
  });

  document.getElementById('main-card').className = 'card';
  document.getElementById('conf-label').className = 'conf-label';
  document.getElementById('conf-row').className   = 'conf-row';

  renderOpts(verb[form], verb, form, idx, uid);
}

/* ── Build answer options ── */
function buildOpts(correct, verb, form, verbIdx, uid) {
  let traps = [];

  // 1. Other forms of the SAME verb (classic confusion trap)
  FORMS.forEach(f => {
    if (f !== form && verb[f] !== correct)
      traps.push({ text: verb[f], isTrap: true });
  });

  // 2. Same form from all units (cross-unit distractors)
  UNITS.forEach((u, ui) => {
    u.verbs.forEach((v, i) => {
      if (!(ui === uid && i === verbIdx) && v[form] !== correct)
        traps.push({ text: v[form], isTrap: false });
    });
  });

  // Deduplicate
  const seen = new Set([correct]);
  const filtered = traps.filter(t => {
    if (seen.has(t.text)) return false;
    seen.add(t.text);
    return true;
  });

  // Prefer same-verb traps (up to 2), fill rest from pool
  const sameVerb = filtered.filter(t =>  t.isTrap);
  const other    = filtered.filter(t => !t.isTrap);
  const chosen   = [...sameVerb.slice(0, 2)];
  while (chosen.length < 3 && other.length)
    chosen.push(other.splice(Math.floor(Math.random() * other.length), 1)[0]);
  while (chosen.length < 3)
    chosen.push({ text: '—', isTrap: false });

  return shuffle([{ text: correct, isCorrect: true, isTrap: false }, ...chosen.slice(0, 3)]);
}

function renderOpts(correct, verb, form, verbIdx, uid) {
  const grid = document.getElementById('opt-grid');
  grid.innerHTML = '';
  buildOpts(correct, verb, form, verbIdx, uid).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = opt.text + (opt.isTrap ? '<span class="opt-trap">⚠ trap!</span>' : '');
    btn.onclick = () => selectOpt(opt, correct, form, btn);
    grid.appendChild(btn);
  });
}

/* ── Select answer ── */
function selectOpt(opt, correct, form, btn) {
  if (waitAnswer) return;  // already answered, waiting for confidence click
  waitAnswer = true;

  const isCorrect = opt.text === correct;
  lastCorrect = isCorrect;

  // Freeze all buttons and mark correct one
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const raw = b.childNodes[0].textContent.trim();
    if (raw === correct) b.className = 'opt rev-correct';
  });
  btn.className = isCorrect ? 'opt sel-correct' : 'opt sel-wrong';

  // Card colour
  document.getElementById('main-card').className = 'card ' + (isCorrect ? 'correct' : 'wrong');

  // Streak
  streak = isCorrect ? Math.min(5, streak + 1) : 0;
  renderStreak();

  // Log result
  sessionLog.push({ verb: queue[qIdx].verb, uid: queue[qIdx].uid, idx: queue[qIdx].idx, correct: isCorrect });

  // Reveal all 3 forms
  const rr = document.getElementById('reveal-row');
  rr.style.display = 'flex';
  ['v1','v2','v3'].forEach(f => {
    const el = document.getElementById('rb-' + f);
    el.className = 'fb ' + (f === form ? (isCorrect ? 'hit' : 'miss') : 'dim');
  });

  // Feedback flash
  flashFeedback(isCorrect);

  // Show confidence buttons
  document.getElementById('conf-label').className = 'conf-label show';
  document.getElementById('conf-row').className   = 'conf-row show';
}

/* ── Confidence rating → advance ── */
function rateNext(conf) {
  if (!waitAnswer) return;
  const { uid, idx } = queue[qIdx];
  applyRating(uid, idx, lastCorrect, conf);

  // Hide confidence controls
  document.getElementById('conf-label').className = 'conf-label';
  document.getElementById('conf-row').className   = 'conf-row';

  qIdx++;
  if (qIdx >= queue.length) { showResult(); return; }
  setTimeout(loadQ, 80);
}

/* ── Feedback flash ── */
function flashFeedback(ok) {
  const icon = document.getElementById('feedback-icon');
  icon.textContent = ok ? '✓' : '✗';
  icon.style.color = ok ? 'var(--green)' : 'var(--red)';
  icon.className   = 'feedback-icon pop';
  setTimeout(() => { icon.className = 'feedback-icon fade'; }, 650);
  setTimeout(() => { icon.className = 'feedback-icon'; },      1050);
}

/* ═══════════════════════════════════════
   RESULT SCREEN
═══════════════════════════════════════ */
function showResult() {
  const correct = sessionLog.filter(r => r.correct).length;
  const total   = sessionLog.length;
  const pct     = Math.round(correct / total * 100);

  const label = currentUnit !== null
    ? `UNIT ${currentUnit + 1} — ${UNITS[currentUnit].title}`
    : 'Due review session';

  document.getElementById('res-unit-label').textContent = label;
  document.getElementById('res-score').textContent      = `${correct}/${total}`;
  document.getElementById('res-caption').textContent    =
    pct >= 90 ? '🏆 Excellent!' :
    pct >= 70 ? '👍 Good job!'  :
    pct >= 50 ? '📖 Keep going' :
                '💪 More practice needed';

  // Verb list — deduplicated
  const list = document.getElementById('res-list');
  list.innerHTML = '';
  const seen = new Set();
  sessionLog.forEach(r => {
    if (seen.has(r.verb.v1)) return;
    seen.add(r.verb.v1);
    const allOk = sessionLog.filter(x => x.verb.v1 === r.verb.v1).every(x => x.correct);
    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `
      <div class="res-dot ${allOk ? 'ok' : 'fail'}"></div>
      <span class="res-forms">${r.verb.v1} — ${r.verb.v2} — ${r.verb.v3}</span>
      <span class="res-ru">${r.verb.ru}</span>`;
    list.appendChild(row);
  });

  showScreen('result');
}

function retrySession() {
  if (currentUnit !== null) startUnit(currentUnit);
  else startDueSession();
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function goHome() { renderHome(); showScreen('home'); }

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

/* ── INIT ── */
renderHome();
</script>
