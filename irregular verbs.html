<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irregular Verbs — SRS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   TOKENS
───────────────────────────────────────── */
:root {
  --bg:       #0f0f14;
  --surface:  #1a1a24;
  --surface2: #22222f;
  --border:   rgba(255,255,255,0.08);
  --text:     #f0eff8;
  --muted:    #8a8aaa;
  --accent:   #7c6ff7;
  --accent2:  #a78bfa;
  --green:    #34d399;
  --green-bg: rgba(52,211,153,0.13);
  --red:      #f87171;
  --red-bg:   rgba(248,113,113,0.13);
  --amber:    #f59e0b;
  --amber-bg: rgba(245,158,11,0.13);
  --gold:     #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen { display: none; width: 100%; max-width: 760px; padding: 2rem 1.5rem 4rem; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ─────────────────────────────────────────
   HOME  ·  header
───────────────────────────────────────── */
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  letter-spacing: -1px;
  margin-bottom: .25rem;
}
.logo span { color: var(--accent2); }
.tagline { color: var(--muted); font-size: .93rem; margin-bottom: 2.2rem; }

/* ─────────────────────────────────────────
   TABS  (Units / Due / Progress)
───────────────────────────────────────── */
.tab-bar {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  width: 100%;
  max-width: 480px;
  margin-bottom: 2rem;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: .88rem;
  font-weight: 500;
  padding: .55rem .8rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
}
.tab-btn.active { background: var(--accent); color: #fff; }
.tab-count {
  font-size: .68rem;
  font-weight: 700;
  background: var(--surface2);
  color: var(--muted);
  border-radius: 99px;
  padding: 1px 7px;
  min-width: 20px;
  text-align: center;
  transition: all .2s;
}
.tab-btn.active .tab-count { background: rgba(255,255,255,.22); color: #fff; }
.tab-count.has-due { background: var(--red-bg); color: var(--red); }
.tab-btn.active .tab-count.has-due { background: rgba(255,255,255,.22); color: #fff; }

.tab-panel { display: none; width: 100%; }
.tab-panel.active { display: block; }

/* ─────────────────────────────────────────
   UNITS GRID
───────────────────────────────────────── */
.units-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 1rem;
  width: 100%;
}
.unit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.3rem 1.5rem;
  cursor: pointer;
  transition: all .2s;
}
.unit-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateY(-2px); }
.unit-card:active { transform: translateY(0); }
.unit-num { font-size: .7rem; font-weight: 700; color: var(--accent); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: .45rem; }
.unit-title { font-size: .92rem; font-weight: 500; margin-bottom: .7rem; line-height: 1.3; }
.unit-meta { font-size: .78rem; color: var(--muted); }
.unit-stars { font-size: .82rem; color: var(--gold); margin-top: .35rem; }
.unit-bar { height: 3px; background: var(--border); border-radius: 99px; margin-top: .75rem; overflow: hidden; }
.unit-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .4s; }
.units-footer { font-size: .76rem; color: var(--muted); margin-top: 1.4rem; text-align: center; }

/* ─────────────────────────────────────────
   DUE TAB
───────────────────────────────────────── */
.due-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  width: 100%;
}
.due-header-text { font-size: .88rem; color: var(--muted); }
.due-start-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: .55rem 1.3rem;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s;
}
.due-start-btn:hover { background: var(--accent2); }

.due-group { margin-bottom: 1.6rem; }
.due-group-label {
  font-size: .7rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: .55rem;
  padding-left: .15rem;
}
.due-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .6rem 1rem;
  margin-bottom: .38rem;
  font-size: .87rem;
}
.due-row .dr-forms { flex: 1; font-weight: 500; }
.due-row .dr-ru { color: var(--muted); font-size: .78rem; white-space: nowrap; }
.conf-pill {
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  white-space: nowrap;
}
.conf-pill.easy { background: var(--green-bg); color: var(--green); }
.conf-pill.ok   { background: var(--amber-bg); color: var(--amber); }
.conf-pill.hard { background: var(--red-bg);   color: var(--red); }
.conf-pill.new  { background: rgba(124,111,247,.15); color: var(--accent2); }

.due-empty { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
.due-empty-icon { font-size: 3rem; margin-bottom: 1rem; }
.due-empty p { font-size: .95rem; line-height: 1.7; }

/* ─────────────────────────────────────────
   STUDY SCREEN  ·  header / progress
───────────────────────────────────────── */
.study-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.6rem;
}
.back-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: .5rem 1.1rem;
  border-radius: 9px;
  cursor: pointer;
  font-size: .84rem;
  font-family: inherit;
  transition: all .2s;
}
.back-btn:hover { color: var(--text); border-color: var(--accent); }
.q-counter { font-size: .85rem; color: var(--muted); }
.q-counter strong { color: var(--text); }

.top-bar-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 1.8rem; }
.top-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

.srs-pill {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: .28rem .85rem;
  font-size: .74rem;
  color: var(--muted);
  margin-bottom: .9rem;
}
.srs-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.streak-row { display: flex; gap: 5px; margin-bottom: 1.4rem; }
.streak-pip {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: background .25s, box-shadow .25s;
}
.streak-pip.lit { background: var(--gold); box-shadow: 0 0 7px rgba(251,191,36,.55); }

/* ─────────────────────────────────────────
   VERB CARD
───────────────────────────────────────── */
.card-wrap { width: 100%; max-width: 530px; margin-bottom: 1.4rem; }
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 2.4rem 2rem 1.8rem;
  text-align: center;
  transition: border-color .28s, box-shadow .28s;
}
.card.correct { border-color: var(--green); box-shadow: 0 0 36px rgba(52,211,153,.16); }
.card.wrong   { border-color: var(--red);   box-shadow: 0 0 36px rgba(248,113,113,.16); }

.card-label { font-size: .8rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: .5rem; }
.card-translation { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--text); margin-bottom: .25rem; line-height: 1.2; }
.card-base { font-size: .8rem; color: var(--muted); margin-bottom: 1.5rem; }
.card-ask-label { font-size: .74rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: .4rem; }
.card-ask-form { font-size: 1.05rem; color: var(--muted); font-style: italic; }

.reveal-row {
  display: none;
  gap: .5rem;
  justify-content: center;
  align-items: center;
  margin: 1.1rem 0 .4rem;
  flex-wrap: wrap;
}
.fb { /* form badge */
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .32rem .8rem;
  font-size: .84rem;
  font-weight: 500;
  transition: all .28s;
}
.fb.hit  { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.fb.miss { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.fb.dim  { opacity: .35; }
.fb-arr  { color: var(--muted); font-size: .8rem; }

/* ─────────────────────────────────────────
   ANSWER OPTIONS
───────────────────────────────────────── */
.opt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .7rem;
  width: 100%;
  max-width: 530px;
}
.opt {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 13px;
  padding: .95rem 1rem;
  cursor: pointer;
  font-family: inherit;
  font-size: .9rem;
  line-height: 1.4;
  text-align: center;
  transition: all .16s;
}
.opt:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); transform: translateY(-1px); }
.opt:active:not(:disabled) { transform: translateY(0); }
.opt:disabled { cursor: not-allowed; }
.opt.sel-correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.opt.sel-wrong   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.opt.rev-correct { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.opt-trap {
  display: block;
  font-size: .63rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--red);
  opacity: 0;
  transition: opacity .3s .15s;
  margin-top: 3px;
}
.opt.sel-wrong .opt-trap { opacity: 1; }

/* ─────────────────────────────────────────
   CONFIDENCE BUTTONS
───────────────────────────────────────── */
.conf-label {
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 1.1rem;
  margin-bottom: .5rem;
  opacity: 0;
  transform: translateY(6px);
  transition: all .25s .05s;
  pointer-events: none;
  width: 100%;
  max-width: 530px;
  text-align: center;
}
.conf-label.show { opacity: 1; transform: translateY(0); pointer-events: none; }

.conf-row {
  display: flex;
  gap: .6rem;
  width: 100%;
  max-width: 530px;
  opacity: 0;
  transform: translateY(8px);
  transition: all .28s .1s;
  pointer-events: none;
}
.conf-row.show { opacity: 1; transform: translateY(0); pointer-events: all; }

.conf-btn {
  flex: 1;
  border: 1.5px solid;
  border-radius: 12px;
  padding: .72rem .4rem;
  font-family: inherit;
  font-size: .86rem;
  font-weight: 700;
  cursor: pointer;
  transition: filter .18s, transform .18s;
  text-align: center;
}
.conf-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.conf-btn:active { transform: translateY(0); }
.conf-sub { display: block; font-size: .68rem; font-weight: 400; opacity: .7; margin-top: 2px; }

.conf-btn.easy { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.conf-btn.ok   { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.conf-btn.hard { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }

/* ─────────────────────────────────────────
   FEEDBACK FLASH
───────────────────────────────────────── */
.feedback-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 200;
}
.feedback-icon {
  font-size: 5.5rem;
  opacity: 0;
  transform: scale(.3);
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
}
.feedback-icon.pop  { opacity: 1; transform: scale(1); }
.feedback-icon.fade { opacity: 0; transform: scale(1.25); transition: all .35s ease; }

/* ─────────────────────────────────────────
   RESULT SCREEN
───────────────────────────────────────── */
.res-unit-label { font-size: .8rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: .5rem; }
.res-score { font-family: 'Playfair Display', serif; font-size: 4.2rem; font-weight: 700; color: var(--accent2); line-height: 1; margin-bottom: .3rem; }
.res-caption { color: var(--muted); font-size: 1rem; margin-bottom: 2rem; }

.res-list { width: 100%; }
.res-row {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .58rem .8rem;
  border-bottom: 1px solid var(--border);
  font-size: .84rem;
}
.res-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.res-dot.ok   { background: var(--green); }
.res-dot.fail { background: var(--red); }
.res-forms { flex: 1; font-weight: 500; }
.res-ru { color: var(--muted); font-size: .78rem; }

.res-btns { display: flex; gap: .9rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
.btn-pri {
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  padding: .8rem 2.2rem;
  font-family: inherit; font-size: .9rem; font-weight: 500;
  cursor: pointer; transition: background .2s;
}
.btn-pri:hover { background: var(--accent2); }
.btn-sec {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  padding: .8rem 2.2rem;
  font-family: inherit; font-size: .9rem;
  cursor: pointer; transition: all .2s;
}
.btn-sec:hover { border-color: var(--accent); }

/* ─────────────────────────────────────────
   PROGRESS TAB  (unchanged)
───────────────────────────────────────── */
.prog-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .75rem;
  width: 100%;
  margin-bottom: 1.8rem;
}
.prog-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.1rem .8rem;
  text-align: center;
}
.prog-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--accent2);
  line-height: 1;
  margin-bottom: .3rem;
}
.prog-stat-lbl { font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .5px; }
.prog-accuracy-wrap { width: 100%; margin-bottom: 2rem; }
.prog-accuracy-label {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: .45rem;
}
.prog-accuracy-label strong { color: var(--text); }
.prog-accuracy-bar { width: 100%; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-accuracy-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.prog-unit-block { width: 100%; margin-bottom: .6rem; }
.prog-unit-header {
  display: flex;
  align-items: center;
  gap: .8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .85rem 1.1rem;
  cursor: pointer;
  transition: border-color .2s;
  user-select: none;
}
.prog-unit-header:hover { border-color: var(--accent); }
.prog-unit-header.open { border-radius: 12px 12px 0 0; border-color: var(--accent); }
.puh-num { font-size: .68rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
.puh-title { font-size: .88rem; font-weight: 500; flex: 1; }
.puh-meta { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
.puh-chevron { color: var(--muted); font-size: .8rem; transition: transform .2s; flex-shrink: 0; }
.prog-unit-header.open .puh-chevron { transform: rotate(90deg); }
.puh-mini-bar { width: 48px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; flex-shrink: 0; }
.puh-mini-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.prog-unit-body {
  display: none;
  background: var(--surface2);
  border: 1px solid var(--accent);
  border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
}
.prog-unit-body.open { display: block; }
.prog-verb-row {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .55rem 1.1rem;
  border-bottom: 1px solid var(--border);
  font-size: .82rem;
}
.prog-verb-row:last-child { border-bottom: none; }
.pvr-forms { flex: 1; font-weight: 500; }
.pvr-ru { color: var(--muted); font-size: .76rem; }
.pvr-reps { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.pvr-next { font-size: .7rem; color: var(--muted); white-space: nowrap; text-align: right; }
.pvr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pvr-dot.mastered { background: var(--green); }
.pvr-dot.learning { background: var(--amber); }
.pvr-dot.struggling { background: var(--red); }
.pvr-dot.unseen { background: var(--border); }
.prog-reset-row { width: 100%; display: flex; justify-content: center; margin-top: 2rem; }
.prog-reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 9px;
  padding: .5rem 1.4rem;
  font-family: inherit;
  font-size: .8rem;
  cursor: pointer;
  transition: all .2s;
}
.prog-reset-btn:hover { border-color: var(--red); color: var(--red); }

@media (max-width: 520px) {
  .opt-grid { grid-template-columns: 1fr; }
  .card-translation { font-size: 1.6rem; }
  .conf-btn { padding: .62rem .3rem; font-size: .8rem; }
  .conf-sub { font-size: .63rem; }
  .res-score { font-size: 3rem; }
}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen active" id="screen-home">
  <div style="text-align:center;padding:3rem 0 2rem;width:100%">
    <div class="logo">Irregular<span>Verbs</span></div>
    <div class="tagline">Spaced Repetition · 120 irregular verbs · Russian translation</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-units" onclick="switchTab('units',this)">Units</button>
    <button class="tab-btn"        id="tab-btn-due"   onclick="switchTab('due',this)">
      Due &nbsp;<span class="tab-count" id="due-count">0</span>
    </button>
    <button class="tab-btn"        id="tab-btn-progress" onclick="switchTab('progress',this)">Progress</button>
  </div>

  <div class="tab-panel active" id="tab-units">
    <div class="units-grid" id="units-grid"></div>
    <p class="units-footer">All units are open · progress saved in your browser</p>
  </div>

  <div class="tab-panel" id="tab-due">
    <div id="due-content"></div>
  </div>

  <div class="tab-panel" id="tab-progress">
    <div id="progress-content"></div>
  </div>
</div>

<!-- STUDY SCREEN -->
<div class="screen" id="screen-study">
  <div class="study-header">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="q-counter"><strong id="q-cur">1</strong> / <span id="q-tot">20</span></div>
  </div>
  <div class="top-bar-wrap"><div class="top-bar-fill" id="top-bar" style="width:0%"></div></div>

  <div class="srs-pill"><div class="srs-pip"></div><span id="srs-label">New card</span></div>
  <div class="streak-row" id="streak-row"></div>

  <div class="card-wrap">
    <div class="card" id="main-card">
      <div class="card-label">Перевод</div>
      <div class="card-translation" id="c-translation">—</div>
      <div class="card-base" id="c-base"></div>
      <div class="card-ask-label">Выберите правильную форму</div>
      <div class="card-ask-form" id="c-ask-form">Past Simple (V2)</div>
      <div class="reveal-row" id="reveal-row">
        <span class="fb" id="rb-v1"></span>
        <span class="fb-arr">›</span>
